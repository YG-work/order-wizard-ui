<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Wizard — ИП ванковский 2026-06-12</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;background:#f8fafc}
  header{padding:20px 24px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
  header h1{margin:0 0 4px;font-size:20px}
  header .meta{font-size:12px;color:#64748b}
  main{padding:20px 24px;max-width:1400px;margin:0 auto}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
  .kpi .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
  .kpi .lbl{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:22px;font-weight:600;margin-top:4px}
  .card-urgent .val{color:#ef4444}
  .card-needed .val{color:#f59e0b}
  .card-ok .val{color:#22c55e}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8fafc;padding:8px 12px;text-align:left;font-weight:600;color:#475569;border-bottom:1px solid #e2e8f0}
  td{padding:8px 12px;border-bottom:1px solid #f1f5f9}
  tr:hover td{background:#f8fafc}
  .status-urgent{color:#ef4444;font-weight:600}
  .status-needed{color:#f59e0b;font-weight:600}
  .status-ok{color:#22c55e}
  .section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:24px}
  .section-title{font-size:16px;font-weight:600;margin-bottom:16px;color:#0f172a}
</style>
</head>
<body>
<header>
  <h1>Order Wizard — ИП ванковский</h1>
  <div class="meta">Составлено баланса: 2026-06-12 | calc_id: 20260612080950_4298fd</div>
</header>
<main>
  <div class="kpi">
    <div class="card card-urgent">
      <div class="lbl">SSRGENT</div>
      <div class="val">1</div>
    </div>
    <div class="card card-needed">
      <div class="lbl">NEEDED</div>
      <div class="val">1</div>
    </div>
    <div class="card card-ok">
      <div class="lbl">OK</div>
      <div class="val">0</div>
    </div>
    <div class="card">
      <div class="lbl">SURPLUS</div>
      <div class="val">15</div>
    </div>
    <div class="card">
      <div class="lbl">BOXES</div>
      <div class="val">5</div>
    </div>
    <div class="card">
      <div class="lbl">BUDGET</div>
      <div class="val">0 ауб.</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Итоговый отчёт (ускоренность)</div>
    <table>
      <thead><tr><th>Материал</th><th>Статус</th><th>Остаток</th><th>ЗапасамMOQ</th><th>МоѤ‹</th><th>Бюджес</th><th>Статуу</th></tr></thead>
      <tbody>
        <tr><td>ИПЯANKOVSKY</td><td class="status-urgent">URGENT</td><td></td><td></td><td></td><td></td><td></td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
