const fmtR=n=>n==null?'—':Number(n).toLocaleString('ru',{style:'currency',currency:'RUB',maximumFractionDigits:0});
const k=D.kpi||{};

});
const SI=k=>{const d=(D.stages||{})[k];if(!d)return[];return Array.isArray(d)?d:Object.values(d);};
const BF={'status_flag':1,'flag':1,'abc_class':1};
const BC={'Срочно':'bu','Нужно':'bn','OK':'bo','Избыток':'bs','A':'ba','B':'bb','C':'bc'};
function RT(tid,rows,cid){
const el=document.getElementById(tid);if(!el)return;
if(!rows||!rows.length){el.innerHTML='<p style="color:var(--mu);padding:12px">No data</p>';if(cid)document.getElementById(cid).textContent='0';return;}
const cols=Object.keys(rows[0]).filter(c=>c!=='source_skus'&&c!=='items');
let h='<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
rows.slice(0,500).forEach(r=>{h+='<tr>'+cols.map(c=>{
const v=r[c];
if(v==null)return'<td>—</td>';
if(BF[c])return'<td><span class="bx '+(BC[v]||'')+'">'+v+'</span></td>';
if(typeof v==='number')return'<td class="r">'+(v>=1000?fmt(v):v)+'</td>';
return'<td>'+v+'</td>';
}).join('')+'</tr>';});
h+='</tbody></table>';
el.innerHTML=h;if(cid)document.getElementById(cid).textContent=rows.length;
}

})();
