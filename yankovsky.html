const STAGE_KEYS = ['1_stocks','2_sales','3_forecast','4_bom','5_balance','6_abc','7_boxes','8_budget','9_flags','10_transport'];

const container = document.getElementById('stages-container');

STAGE_KEYS.forEach((key, idx) => {
  const stageData = (DATA.stages || {})[key];
  const label = STACE_LABELS[idx];
  const count = stageData ? Object.keys(stageData).length : 0;

  const div = document.createElement('div');
  div.className = 'stage';
  div.innerHTML = `
    <div class="stage-header" onclick="toggleStage(this)">
      <div class="stage-num ${stageData ? 'done' : ''}">${idx+1}</div>
      <div class="stage-title">${label}</div>
      <div class="stage-badge">${stageData ? count + ' записей' : 'нет данныхд'}</div>
      <div style="color:#94a3b8">▶</div>
    </div>
    <div class="stage-body">
      <div class="table-wrap" id="tbl-${key}"></div>
      ${stageData ? '<button class="export-btn" onclick="exportCSV(\''+key+'\'')">⬇ CSV</button>' : ''}
    </div>`;
  container.appendChild(div);

  if (stageData) renderTable(key, stageData);
});

function renderTable(key, data) {
  const el = document.getElementById('tbl-' + key);
  if (!el) return;
  const items = typeof data === 'object' && !Array.isArray(data) ? Object.values(data) : data;
  if (!items || items.length === 0) { el.innerHTML = '<em>Нет данных</em>'; return; }
  const first = items[0];
  if (typeof first !== 'object') { el.innerHTML = JSON.stringify(data).substring(0, 500); return; }
  const cols = Object.keys(first).filter(c => !['source_skus','items'].includes(c));
  let html = '<table><thead><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
  items.slice(0, 200).forEach(row => {
    html += '<tr>' + cols.map(c => {
      const v = row[c];
      if (['status_flag'].includes(c)) return `<td><span class="badge ${v}">${v}</span></td>`;
      if (['abc_class'].includes(c)) return `<td><span class="badge ${v}">${v}</span></td>`;
      if (typeof v === 'number') return `<td style="text-align:right">${v >= 1000 ? fmt(v) : v}</td>`;
      return `<td>${v ?? ''}</td>`;
    }).join('') + '</tr>';
  });
  html += '</tbody></table>';
  if (items.length > 200) html += `<p style="color:#94a3b8;font-size:0.75rem;margin-top:8px">Показаны первые 200 из ${items.length}</p>`;
  el.innerHTML = html;
}

function toggleStage(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('div:,st,child');
  body.classList.toggle('open');
  arrow.textContent = body.classList.contains('open') ? '▼' : '▶';
}

function exportCSV(key) {
  const data = (DATA.stages || {})[key];
  if (!data) return;
  const items = typeof data === 'object' && !Array.isArray(data) ? Object.values(data) : data;
  if (!items || !items.length) return;
  const cols = Object.keys(items[0]);
  const csv = [cols.join(';'), ...items.map(r => cols.map(c => {
    const v = r[c] ?? '';
    return typeof v === 'string' && v.includes(';') ? `"${v}"` : v;
  }).join(';'))].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `order_wizard_${key}.csv`; a.click();
}

// Открываем первый stage по умолчанию
setTimeout(() => {
  const firstHeader = document.querySelector('.stage-header');
  if (firstHeader) toggleStage(firstHeader);
}, 100);
</script>
</body>
</html>
